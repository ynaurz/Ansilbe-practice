- name: Download etcd
  get_url:
    url: https://github.com/etcd-io/etcd/releases/download/v3.5.12/etcd-v3.5.12-linux-amd64.tar.gz
    dest: /tmp/etcd-v3.5.12-linux-amd64.tar.gz
    mode: '0644'

- name: Extract etcd
  unarchive:
    src: /tmp/etcd-v3.5.12-linux-amd64.tar.gz
    dest: /tmp
    remote_src: true

- name: Install etcd binaries
  copy:
    src: "/tmp/etcd-v3.5.12-linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: '0755'
    remote_src: true
  loop:
    - etcd
    - etcdctl

- name: Create etcd user
  user:
    name: etcd
    system: true
    shell: /usr/sbin/nologin
    create_home: false


- name: Deploy etcd config
  template:
    src: etcd.conf.j2
    dest: /etc/etcd.conf
    mode: '0644'

- name: Deploy etcd systemd service
  template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: '0644'

- name: Stop etcd 
  systemd: 
    name: etcd
    state: stopped
  failed_when: false

- name: Remove old etcd
  file:
    path: /var/lib/etcd
    state: absent

- name: Create etcd data direct 
  file:
    path: /var/lib/etcd
    state: directory
    owner: etcd
    group: etcd
    mode: "0755"

- name: Enable and start etcd
  systemd:
    name: etcd
    enabled: true
    state: started
    daemon_reload: true